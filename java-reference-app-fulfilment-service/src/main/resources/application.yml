info:
  app: Fulfilment Service
  version: 0.0.1
  description: Fulfilment API
jwt:
  private.key: classpath:app.key
  public.key: classpath:app.pub
spring:
  datasource:
    url: jdbc:postgresql://devcamp-db:5432/postgres
    username: user
    password: password
    driverClassName: org.postgresql.Driver
  flyway:
    enabled: true
    ignore-migration-patterns: "*:missing"
    schemas: pc
    default-schema: pc
  jpa:
    hibernate:
      ddl-auto: none
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: password
pub.key: classpath:app.pub
springdoc:
  show-actuator: false
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,metrics
