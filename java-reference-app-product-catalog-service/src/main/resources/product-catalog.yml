openapi: "3.0.0"

info:
  version: "1.0.0"
  title: "Product Catalog"
  license:
    name: "MIT"

servers:
  - url: "http://localhost:8085/v1"

paths:

  /products:
    get:
      summary: "Get products"
      operationId: getProducts
      tags:
        - "products"
      security: []
      responses:
        "200":
          description: "Expected response"
          content:
            text/plain:
              schema:
                type: string

  /create-products:
    post:
      summary: "Create a product"
      operationId: createProduct
      tags:
        - "products"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductDto"
      responses:
        "200":
          description: "Product created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDto"

components:
  schemas:
    ProductDto:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        imageUrl:
          type: string
      required:
        - name
        - price