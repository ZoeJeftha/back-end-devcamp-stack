server.port: 8080
info:
  app: Customer Inquiry Service
  version: 0.0.1
  description: Customer Information Store API
spring:
  datasource:
    url: jdbc:postgresql://DevCamp-Postgres-db:5432/postgres
    username: user
    password: password
    driverClassName: org.postgresql.Driver
  flyway:
    ignore-migration-patterns: "*:missing"
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: cis
pub.key: classpath:app.pub
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,metrics
